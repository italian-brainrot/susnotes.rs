[package]
name = "susnotes"
version = "0.1.0"
edition = "2021"
description = "A local encrypted notes / knowledge base app written in pure Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.32", features = ["default"] }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
pulldown-cmark = "0.12"
aes-gcm = { version = "0.10", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
regex = "1"
getrandom = "0.2"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
strip = true
